name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run test suite
        run: ./tests/test_replace-tokens.sh

      - name: ShellCheck
        run: shellcheck replace-tokens.sh tests/test_replace-tokens.sh
