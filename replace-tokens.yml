parameters:
  - name: targetFiles
    type: string
    default: '**/*.tf'
  - name: excludeDirs
    type: string
    default: '.terraform'
  - name: secretVariables
    type: object
    default: []
    # Pipeline variable names referenced by your #{ }# tokens that are marked
    # secret (e.g. set by AzureKeyVault@N). REQUIRED for those specifically:
    # Azure Pipelines does NOT auto-expose secret variables to script/bash
    # steps as environment variables (only non-secret ones are auto-exposed),
    # so each secret name must be explicitly listed here to be mapped in.
    # Example:
    #   secretVariables:
    #     - My.Connection-String
    #     - ApiKey

steps:
  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob dotglob

      mapfile -t patterns <<< "$TARGET_FILES"
      mapfile -t exclude_dirs <<< "${EXCLUDE_DIRS//,/$'\n'}"

      declare -A rt_values rt_present
      IFS=',' read -r -a rt_names <<< "$RT_SECRET_NAMES"
      for n in "${rt_names[@]}"; do
        [ -z "$n" ] && continue
        carrier="RT_SECRET_${n//./_}"
        carrier="${carrier//-/_}"
        key=$(printf '%s' "$n" | tr '[:lower:]' '[:upper:]'); key="${key//[^A-Za-z0-9]/_}"
        if [ -n "${!carrier+x}" ]; then
          rt_present[$key]=1
          rt_values[$key]="${!carrier}"
        fi
      done

      is_excluded() {
        local path="$1" dir
        for dir in "${exclude_dirs[@]}"; do
          [ -z "$dir" ] && continue
          case "/$path/" in
            *"/$dir/"*) return 0 ;;
          esac
        done
        return 1
      }

      files=()
      for pattern in "${patterns[@]}"; do
        [ -z "$pattern" ] && continue
        for f in $pattern; do
          [ -f "$f" ] || continue
          is_excluded "$f" && continue
          files+=("$f")
        done
      done

      if [ "${#files[@]}" -eq 0 ]; then
        echo "##vso[task.logissue type=warning]replace-tokens: no files matched pattern(s): $TARGET_FILES"
        exit 0
      fi

      normalize_key() {
        local name="$1" key
        key=$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')
        key="${key//[^A-Za-z0-9]/_}"
        printf '%s' "$key"
      }

      process_line() {
        local line="$1" out="" before rest name after key value
        while [[ "$line" == *'#{'*'}#'* ]]; do
          before="${line%%#{*}"
          rest="${line#*#{}"
          name="${rest%%\}#*}"
          after="${rest#*\}#}"
          key=$(normalize_key "$name")
          if [ -n "${rt_present[$key]+x}" ]; then
            value="${rt_values[$key]}"
            if [ -n "$value" ]; then
              out+="${before}${value}"
              printf 'REPLACED:%s\n' "$name" >&3
            else
              out+="${before}"
              printf 'EMPTYVALUE:%s\n' "$name" >&3
            fi
          elif [ -n "${!key+x}" ]; then
            value="${!key}"
            if [ -n "$value" ]; then
              out+="${before}${value}"
              printf 'REPLACED:%s\n' "$name" >&3
            else
              out+="${before}"
              printf 'EMPTYVALUE:%s\n' "$name" >&3
            fi
          else
            out+="${before}"
            printf 'MISSING:%s\n' "$name" >&3
          fi
          line="$after"
        done
        out+="$line"
        printf '%s\n' "$out"
      }

      log_event() {
        local event="$1" file="$2" name="${1#*:}"
        case "$event" in
          REPLACED:*)
            echo "replace-tokens: replaced #{$name}# in $file"
            ;;
          EMPTYVALUE:*)
            echo "##vso[task.logissue type=warning]replace-tokens: variable for token '#{$name}#' exists but has no value (empty) in $file"
            ;;
          MISSING:*)
            echo "##vso[task.logissue type=warning]replace-tokens: variable not found for token '#{$name}#' in $file"
            ;;
        esac
      }

      exit_code=0

      for file in "${files[@]}"; do
        echo "replace-tokens: processing $file"

        tmpfile=$(mktemp)
        eventfile=$(mktemp)

        {
          while IFS= read -r line || [ -n "$line" ]; do
            process_line "$line"
          done < "$file"
        } 3>"$eventfile" > "$tmpfile"

        mv "$tmpfile" "$file"

        while IFS= read -r event; do
          [ -z "$event" ] && continue
          log_event "$event" "$file"
        done < "$eventfile"
        rm -f "$eventfile"
      done

      exit "$exit_code"
    displayName: 'Replace tokens'
    env:
      TARGET_FILES: ${{ parameters.targetFiles }}
      EXCLUDE_DIRS: ${{ parameters.excludeDirs }}
      RT_SECRET_NAMES: ${{ join(',', parameters.secretVariables) }}
      ${{ each name in parameters.secretVariables }}:
        RT_SECRET_${{ replace(replace(name, '.', '_'), '-', '_') }}: $(${{ name }})
