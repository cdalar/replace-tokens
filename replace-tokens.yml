# Pure-bash drop-in replacement for qetza.replacetokens-task@6 with default
# settings, packaged as an Azure Pipelines step template. See replace-tokens.sh
# for the standalone-script version this mirrors -- prefer this template when
# you have secret pipeline variables to reference, since it automates the
# env: mapping that secrets otherwise require (see the secretVariables
# parameter below).
#
# Defaults replicated:
#   - token pattern: #{ }#
#   - variable source: environment variables (as set by the preceding
#     AzureKeyVault@N task running with RunAsPreJob: true, and/or plain
#     pipeline variables)
#   - variable name -> env var mapping: uppercase, non-alphanumeric -> "_".
#     A token's name is normalized this way to build its lookup key, and
#     (for non-secret variables) the raw process environment is read
#     directly via `env -0`, not bash's own ${!key} variable table, and
#     normalized the same way -- because bash silently refuses to import an
#     env var into its variable table if the literal name isn't a valid
#     shell identifier (e.g. one containing a hyphen), even though the value
#     is genuinely present in the process environment and visible to tools
#     like printenv. This makes lookup work regardless of whether Azure
#     DevOps happened to keep the raw character or convert it.
#   - actionOnMissing: warn (does not fail the step)
#   - keepToken: false (missing/empty variable is replaced with an empty string)
#
# Non-secret pipeline variables are auto-exposed to this step's environment by
# Azure Pipelines itself, so tokens referencing them just work. Secret
# variables (e.g. from AzureKeyVault@N) are never auto-exposed -- list their
# names in the secretVariables parameter below and this template maps each
# one in for you.
#
# Logging (values are never printed, only token/variable names):
#   - a token that gets replaced with a non-empty value -> info line
#   - a token whose variable exists but is set to an empty string -> warning
#   - a token whose variable doesn't exist at all -> warning
#
# Note: matching is done line-by-line, so a token split across a line break
# will not be recognized (the original task scans the whole file; this is
# the one behavioral difference of going dependency-free).
#
# Usage:
#   - template: replace-tokens.yml
#     parameters:
#       targetFiles: '**/*.tf'
#       excludeDirs: '.terraform'
#       secretVariables:
#         - My.Connection-String
#         - ApiKey

parameters:
  - name: targetFiles
    type: string
    default: '**/*.tf'
  - name: excludeDirs
    type: string
    default: '.terraform'
  - name: secretVariables
    type: object
    default: []
    # Pipeline variable names referenced by your #{ }# tokens that are marked
    # secret (e.g. set by AzureKeyVault@N). REQUIRED for those specifically:
    # Azure Pipelines does NOT auto-expose secret variables to script/bash
    # steps as environment variables (only non-secret ones are auto-exposed),
    # so each secret name must be explicitly listed here to be mapped in.
    # Example:
    #   secretVariables:
    #     - My.Connection-String
    #     - ApiKey
  - name: extraEnv
    type: object
    default: {}
    # Arbitrary extra env var entries to inject into the step, keyed by
    # whatever env var name you want your #{ }# tokens to resolve against.
    # Use this for values that aren't plain pipeline variables at all --
    # predefined variables Azure Pipelines withholds by default (like
    # System.AccessToken), or anything else you'd otherwise add to the
    # step's own env: block if you could edit it directly.
    # Example:
    #   extraEnv:
    #     ACCESSTOKEN: $(System.AccessToken)

steps:
  - bash: |
      set -euo pipefail
      shopt -s globstar nullglob dotglob

      if [ -z "${NO_COLOR:-}" ]; then
        c_dim=$'\033[2m'
        c_bold_green=$'\033[1;32m'
        c_reset=$'\033[0m'
      else
        c_dim=''
        c_bold_green=''
        c_reset=''
      fi

      mapfile -t patterns <<< "$TARGET_FILES"
      mapfile -t exclude_dirs <<< "${EXCLUDE_DIRS//,/$'\n'}"

      declare -A rt_values rt_present
      IFS=',' read -r -a rt_names <<< "$RT_SECRET_NAMES"
      for n in "${rt_names[@]}"; do
        [ -z "$n" ] && continue
        carrier="RT_SECRET_${n//./_}"
        carrier="${carrier//-/_}"
        key=$(printf '%s' "$n" | tr '[:lower:]' '[:upper:]'); key="${key//[^A-Za-z0-9]/_}"
        if [ -n "${!carrier+x}" ]; then
          rt_present[$key]=1
          rt_values[$key]="${!carrier}"
        fi
      done

      is_excluded() {
        local path="$1" dir
        for dir in "${exclude_dirs[@]}"; do
          [ -z "$dir" ] && continue
          case "/$path/" in
            *"/$dir/"*) return 0 ;;
          esac
        done
        return 1
      }

      files=()
      for pattern in "${patterns[@]}"; do
        [ -z "$pattern" ] && continue
        for f in $pattern; do
          [ -f "$f" ] || continue
          is_excluded "$f" && continue
          files+=("$f")
        done
      done

      if [ "${#files[@]}" -eq 0 ]; then
        echo "##vso[task.logissue type=warning]replace-tokens: no files matched pattern(s): $TARGET_FILES"
        exit 0
      fi

      normalize_key() {
        local name="$1" key
        key=$(printf '%s' "$name" | tr '[:lower:]' '[:upper:]')
        key="${key//[^A-Za-z0-9]/_}"
        printf '%s' "$key"
      }

      # Build a normalized-key -> value lookup from the raw process
      # environment instead of relying on bash's own variable table
      # (${!key}): bash silently refuses to import env vars whose literal
      # name isn't a valid shell identifier (e.g. one containing a hyphen),
      # even though the value is still present in the process environment.
      # Reading it back via `env -0` sees it regardless of the raw name's
      # shape. This only covers non-secret variables -- secrets are read via
      # the RT_SECRET_ carriers above, which are always valid identifiers.
      declare -A env_values
      while IFS= read -r -d '' entry; do
        env_name="${entry%%=*}"
        env_value="${entry#*=}"
        env_values["$(normalize_key "$env_name")"]="$env_value"
      done < <(env -0)

      process_line() {
        local line="$1" out="" before rest name after key value
        while [[ "$line" == *'#{'*'}#'* ]]; do
          before="${line%%#{*}"
          rest="${line#*#{}"
          name="${rest%%\}#*}"
          after="${rest#*\}#}"
          key=$(normalize_key "$name")
          if [ -n "${rt_present[$key]+x}" ]; then
            value="${rt_values[$key]}"
            if [ -n "$value" ]; then
              out+="${before}${value}"
              printf 'REPLACED:%s\n' "$name" >&3
            else
              out+="${before}"
              printf 'EMPTYVALUE:%s\n' "$name" >&3
            fi
          elif [ -n "${env_values[$key]+x}" ]; then
            value="${env_values[$key]}"
            if [ -n "$value" ]; then
              out+="${before}${value}"
              printf 'REPLACED:%s\n' "$name" >&3
            else
              out+="${before}"
              printf 'EMPTYVALUE:%s\n' "$name" >&3
            fi
          else
            out+="${before}"
            printf 'MISSING:%s\n' "$name" >&3
          fi
          line="$after"
        done
        out+="$line"
        printf '%s\n' "$out"
      }

      log_event() {
        local event="$1" file="$2" name="${1#*:}"
        case "$event" in
          REPLACED:*)
            echo "${c_bold_green}replace-tokens: replaced #{$name}# in $file${c_reset}"
            ;;
          EMPTYVALUE:*)
            echo "##vso[task.logissue type=warning]replace-tokens: variable for token '#{$name}#' exists but has no value (empty) in $file"
            ;;
          MISSING:*)
            echo "##vso[task.logissue type=warning]replace-tokens: variable not found for token '#{$name}#' in $file"
            ;;
        esac
      }

      exit_code=0

      for file in "${files[@]}"; do
        echo "${c_dim}replace-tokens: processing $file${c_reset}"

        tmpfile=$(mktemp)
        eventfile=$(mktemp)

        had_trailing_newline=1
        [ -s "$file" ] && [ -n "$(tail -c1 "$file")" ] && had_trailing_newline=0

        {
          while IFS= read -r line || [ -n "$line" ]; do
            process_line "$line"
          done < "$file"
        } 3>"$eventfile" > "$tmpfile"

        [ "$had_trailing_newline" -eq 0 ] && truncate -s -1 "$tmpfile"

        mv "$tmpfile" "$file"

        while IFS= read -r event; do
          [ -z "$event" ] && continue
          log_event "$event" "$file"
        done < "$eventfile"
        rm -f "$eventfile"
      done

      exit "$exit_code"
    displayName: 'Replace tokens'
    env:
      TARGET_FILES: ${{ parameters.targetFiles }}
      EXCLUDE_DIRS: ${{ parameters.excludeDirs }}
      RT_SECRET_NAMES: ${{ join(',', parameters.secretVariables) }}
      ${{ each name in parameters.secretVariables }}:
        RT_SECRET_${{ replace(replace(name, '.', '_'), '-', '_') }}: $(${{ name }})
      ${{ each pair in parameters.extraEnv }}:
        ${{ pair.key }}: ${{ pair.value }}
